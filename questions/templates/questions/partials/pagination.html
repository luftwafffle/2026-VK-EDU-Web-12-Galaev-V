
<nav aria-label="Page navigation example">
    <ul class="pagination justify-content-center">
        <!-- {% if page_obj.has_previous %}
    <li class="page-item "><a class="page-link" href="?page={{ page_obj.previous_page_number }}">Назад</a></li>
        {% else %}
    <li class="page-item disabled"><a class="page-link" href="#">Назад</a></li>    
        {% endif %} -->


        {% for p in page_obj.elided_range %}
        {% if p == page_obj.paginator.ELLIPSIS %}
            <li class="page-item disabled"><span class="page-link">{{ p }}</span></li>
        {% elif p == page_obj.number %}
            <li class="page-item active" aria-current="page"><span class="page-link">{{ p }}</span></li>
        {% else %}
            <li class="page-item"><a class="page-link" href="?page={{ p }}">{{ p }}</a></li>
        {% endif %}
    {% endfor %}


    <!-- {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}">Вперёд</a></li>
    {% else %}
    <li class="page-item disabled"><a class="page-link" href="#">Вперёд</a></li>
    {% endif %} -->

    </ul>
</nav>
